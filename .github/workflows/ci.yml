name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('manifest.json')); print('manifest.json OK')"

      - name: Validate locales
        run: |
          python3 -c "
          import json
          for f in ['_locales/en/messages.json', '_locales/ru/messages.json']:
              json.load(open(f, encoding='utf-8'))
              print(f'{f} OK')
          "

      - name: Check required files
        run: |
          for f in background.js background-entry.js lib/gemini-notebook-compat.js content/gemini-notebook.js manifest.json README.md app/app.html popup/popup.html; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          test ! -f content/notebooklm.js || { echo "Legacy content script still exists"; exit 1; }
          echo "All required files present"

      - name: Verify version consistency
        run: |
          python3 -c "
          import json
          m = json.load(open('manifest.json'))
          v = m['version']
          print(f'Version: {v}')
          assert v == '1.3.1', f'Version mismatch: expected 1.3.1, got {v}'
          "

      - name: Verify user-facing branding
        run: |
          ! grep -RIn -E '"message"[[:space:]]*:[[:space:]]*"[^"]*NotebookLM' _locales
          ! grep -RIn --exclude='CHANGELOG.md' --exclude='gemini-notebook-compat.js' --exclude='README.md' -E 'Add to NotebookLM|>[^<]*NotebookLM' app popup content background.js manifest.json

      - name: Build extension zip
        run: |
          mkdir -p build
          zip -r "build/add_to_Gemini_Notebook-$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])").zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".qmd-adaptive-search/*" \
            -x "docs/*" \
            -x "build/*" \
            -x "README.md" \
            -x "CHANGELOG.md"

      - name: Validate extension zip
        run: |
          unzip -t build/*.zip
          unzip -l build/*.zip | grep -q "manifest.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: build/*.zip
