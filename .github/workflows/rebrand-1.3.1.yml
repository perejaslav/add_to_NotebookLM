name: Rebrand Gemini Notebook 1.3.1

on:
  push:
    branches:
      - release/gemini-notebook-1.3.1

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/gemini-notebook-1.3.1
          fetch-depth: 0

      - name: Apply product rename
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          def replace_json_values(value):
              if isinstance(value, dict):
                  return {k: replace_json_values(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [replace_json_values(v) for v in value]
              if isinstance(value, str):
                  return value.replace('Add to NotebookLM', 'Add to Gemini Notebook').replace('NotebookLM', 'Gemini Notebook')
              return value

          # User-visible localization and JSON metadata.
          for path in [Path('_locales/en/messages.json'), Path('_locales/ru/messages.json'), Path('manifest.json')]:
              data = json.loads(path.read_text(encoding='utf-8'))
              data = replace_json_values(data)
              if path.name == 'manifest.json':
                  data['version'] = '1.3.1'
                  data['short_name'] = 'Add to Gemini Notebook'
                  for script in data.get('content_scripts', []):
                      script['js'] = ['content/gemini-notebook.js' if x == 'content/notebooklm.js' else x for x in script.get('js', [])]
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # package.json, when present: update only JSON string values and version.
          package = Path('package.json')
          if package.exists():
              data = replace_json_values(json.loads(package.read_text(encoding='utf-8')))
              data['version'] = '1.3.1'
              if data.get('name') == 'add-to-notebooklm':
                  data['name'] = 'add-to-gemini-notebook'
              package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Rename the content script while preserving behavior.
          old_script = Path('content/notebooklm.js')
          new_script = Path('content/gemini-notebook.js')
          if old_script.exists():
              old_script.rename(new_script)

          # Replace the old product name only inside JS string literals and comments.
          string_re = re.compile(r'("(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'|`(?:\\.|[^`\\])*`)', re.DOTALL)
          def replace_in_js(text):
              text = string_re.sub(lambda m: m.group(0).replace('Add to NotebookLM', 'Add to Gemini Notebook').replace('NotebookLM', 'Gemini Notebook'), text)
              text = re.sub(r'(^\s*//.*$)', lambda m: m.group(0).replace('NotebookLM', 'Gemini Notebook'), text, flags=re.MULTILINE)
              text = re.sub(r'/\*.*?\*/', lambda m: m.group(0).replace('NotebookLM', 'Gemini Notebook'), text, flags=re.DOTALL)
              return text

          for path in root.rglob('*.js'):
              if '.git' in path.parts or path == Path('lib/gemini-notebook-compat.js'):
                  continue
              text = path.read_text(encoding='utf-8')
              updated = replace_in_js(text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # HTML: update text nodes and quoted user-facing strings without touching identifiers.
          for path in root.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = string_re.sub(lambda m: m.group(0).replace('Add to NotebookLM', 'Add to Gemini Notebook').replace('NotebookLM', 'Gemini Notebook'), text)
              text = re.sub(r'>([^<>]*NotebookLM[^<>]*)<', lambda m: '>' + m.group(1).replace('NotebookLM', 'Gemini Notebook') + '<', text)
              text = text.replace('v1.3.0', 'v1.3.1')
              path.write_text(text, encoding='utf-8')

          # README: current branding and version. Preserve repository URLs because GitHub repository name is unchanged.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('Add to NotebookLM', 'Add to Gemini Notebook').replace('NotebookLM', 'Gemini Notebook')
          text = text.replace('Текущая версия: 1.3.0', 'Текущая версия: 1.3.1').replace('Current version: **1.3.0**', 'Current version: **1.3.1**')
          marker = '## Что изменилось в версии 1.3.0'
          section = '''## Что изменилось в версии 1.3.1\n\nВерсия 1.3.1 завершает переход на современное название **Gemini Notebook**. Обновлены название расширения, русская и английская локализации, интерфейс, уведомления, контекстное меню, внутренние пути и релизная сборка. Техническая совместимость версии 1.3.0 с прежними доменами Google сохранена.\n\n'''
          if marker in text and '## Что изменилось в версии 1.3.1' not in text:
              text = text.replace(marker, section + marker)
          text = text.replace('- **1.3.0** —', '- **1.3.1** — завершён полный ребрендинг интерфейса и сборки на Gemini Notebook.\n- **1.3.0** —', 1)
          readme.write_text(text, encoding='utf-8')

          # CHANGELOG: preserve historical release text and prepend a new release section.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## [1.3.1] — 2026-08-01\n\n### Переименовано\n\n- Пользовательское название расширения окончательно изменено с прежнего бренда на **Add to Gemini Notebook**\n- Обновлены названия в русском и английском интерфейсе, контекстном меню, уведомлениях и подсказках\n- Content script `content/notebooklm.js` переименован в `content/gemini-notebook.js`\n\n### Изменено\n\n- Версия расширения: `1.3.0` → `1.3.1`\n- README и описание проекта приведены к актуальному бренду Gemini Notebook\n- CI и релизная сборка обновлены для версии 1.3.1\n- Имя установочного архива: `add_to_Gemini_Notebook-1.3.1.zip`\n\n### Исправлено\n\n- Удалены устаревшие пользовательские упоминания прежнего названия из локализаций и интерфейсных файлов\n- Версия в дополнительных страницах расширения синхронизирована с `manifest.json`\n\n### Совместимость\n\n- Сетевая совместимость с прежними доменами Google сохранена; они используются только как технические legacy-адреса\n- Все функции версии 1.3.0 сохранены без изменения поведения\n\n'''
          if '## [1.3.1]' not in text:
              insert_at = text.index('## [1.3.0]')
              text = text[:insert_at] + entry + text[insert_at:]
          changelog.write_text(text, encoding='utf-8')

          # CI version and old content-script path.
          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8').replace("expected 1.3.0", "expected 1.3.1").replace("== '1.3.0'", "== '1.3.1'").replace('content/notebooklm.js', 'content/gemini-notebook.js')
          ci.write_text(text, encoding='utf-8')

          # Remove this one-shot workflow from the resulting branch.
          Path('.github/workflows/rebrand-1.3.1.yml').unlink()
          PY

      - name: Validate branding and syntax
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool _locales/en/messages.json >/dev/null
          python3 -m json.tool _locales/ru/messages.json >/dev/null
          test "$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")" = "1.3.1"
          test -f content/gemini-notebook.js
          test ! -f content/notebooklm.js
          ! grep -RIn --exclude='CHANGELOG.md' --exclude='gemini-notebook-compat.js' --exclude='README.md' -E 'Add to NotebookLM|>[^<]*NotebookLM|"[^"]*NotebookLM|\x27[^\x27]*NotebookLM' _locales app popup content background.js manifest.json

      - name: Commit generated release changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: complete Gemini Notebook rebrand (v1.3.1)"
          git push origin HEAD:release/gemini-notebook-1.3.1
